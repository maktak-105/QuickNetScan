<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0e131f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#007acc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56ccf2"/>
      <stop offset="100%" stop-color="#2f80ed"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#333a4d" stroke-width="8"/>
  
  <!-- Radar / Network Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#25334d" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2c3e5e" stroke-width="5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#364e77" stroke-width="6"/>

  <!-- Network Nodes -->
  <circle cx="256" cy="76" r="14" fill="#00d2ff"/>
  <circle cx="436" cy="256" r="14" fill="#00d2ff"/>
  <circle cx="256" cy="436" r="14" fill="#00d2ff"/>
  <circle cx="76" cy="256" r="14" fill="#00d2ff"/>

  <circle cx="383" cy="129" r="10" fill="#4ec9b0"/>
  <circle cx="383" cy="383" r="10" fill="#4ec9b0"/>
  <circle cx="129" cy="383" r="10" fill="#4ec9b0"/>
  <circle cx="129" cy="129" r="10" fill="#4ec9b0"/>

  <!-- Center Lightning Bolt (High Speed Goroutine Scan) -->
  <polygon points="270,140 180,270 245,270 220,380 340,240 275,240" fill="url(#accentGrad)" filter="drop-shadow(0px 0px 12px rgba(0,210,255,0.6))"/>
</svg>
